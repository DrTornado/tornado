# اختبارُ أدوات البطاقات — يعمل هنا لأن هذا المستودع عامّ
#
# المدقّق يقرّر أيّ بطاقةٍ تُدفع وأيّها تُردّ، فعطلٌ فيه يوقف كلّ بطاقةٍ
# قادمة. وليس على جهاز صاحب المشروع بايثون، فكانت التعديلات تُراجَع بالعين
# ثم تُختبر أوّل مرّة على بطاقةٍ حقيقية — أي بعد فوات الأوان.
#
# ودقائق هذا المستودع مجانية لأنه عامّ، والجولة ثوانٍ: تستورد المدقّق
# فيظهر أيُّ خطأٍ في الصياغة فوراً، ثم تفحص حساباته على أمثلةٍ معلومة.

name: اختبار الأدوات

on:
  push:
    paths:
      - "tools/enrich/**"
      - ".github/workflows/tools-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: يستورد المدقّق؟
        run: python3 -c "import sys; sys.path.insert(0, 'tools/enrich'); import audit_cards; print('ok')"

      - name: حسابُ النبر
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools/enrich")
          from audit_cards import _stress_index, stress_faults

          # (نسخة صوتية، ترتيب المقطع المنبور)
          cases = [
              ("/ˌpʌŋktʃuˈæləti/", 3),   # pʌŋk · tʃu · ˈæ · lə · ti
              ("/ˌrekriˈeɪʃənəl/", 3),   # rek · ri · ˈeɪ · ʃə · nəl
              ("/təˈnæs.ɪ.ti/",    2),   # tə · ˈnæs · ɪ · ti
              ("/ˈpʌŋktʃuəl/",     1),
              ("/rekriˈeɪʃn/",     3),
              ("/nosuchthing/",    0),   # بلا علامة نبر — تسكت القاعدة
          ]
          for ipa, want in cases:
              got = _stress_index(ipa)
              assert got == want, f"{ipa}: {got} والمتوقّع {want}"

          # الادّعاء الموافق لا يُشتكى منه، والمخالف يُردّ
          ok = {"ipa": "/ˌpʌŋktʃuˈæləti/", "pronunciationNote": [
              {"en": "punctuality /ˌpʌŋktʃuˈæləti/",
               "ar": "خمسة مقاطع، والنبر على الثالث"}]}
          bad = {"ipa": "/ˌpʌŋktʃuˈæləti/", "pronunciationNote": [
              {"en": "punctuality /ˌpʌŋktʃuˈæləti/",
               "ar": "خمسة مقاطع، والنبر على الرابع"}]}
          quiet = {"ipa": "/ˌpʌŋktʃuˈæləti/", "pronunciationNote": [
              {"en": "punctuality", "ar": "كلمةٌ طويلة، والياء في آخرها خفيفة"}]}

          assert stress_faults(ok) == [], stress_faults(ok)
          assert len(stress_faults(bad)) == 1, stress_faults(bad)
          assert stress_faults(quiet) == [], stress_faults(quiet)
          print("النبر: كل الحالات صحيحة")
          PY

      - name: مقارنة البطاقة النموذج
        run: |
          set -euo pipefail
          mkdir -p /tmp/t/curated
          cat > /tmp/t/spec.md <<'MD'
          نصٌّ قبل الكتلة.

          ```json
          {
           "punctuality": {
            "ipa": "/x/",
            "meanings": [{"en": "a", "ar": "أ"}]
           }
          }
          ```
          MD
          cat > /tmp/t/curated/00.json <<'JSON'
          {"punctuality": {"ipa": "/x/", "meanings": [{"en": "a", "ar": "أ"}]}}
          JSON
          python3 tools/enrich/spec_sync.py --spec /tmp/t/spec.md --curated /tmp/t/curated

          # ثم تُدرّج المكتبة عن المواصفة — يجب أن يُردّ
          cat > /tmp/t/curated/00.json <<'JSON'
          {"punctuality": {"ipa": "/y/", "meanings": [{"en": "a", "ar": "أ"}]}}
          JSON
          if python3 tools/enrich/spec_sync.py --spec /tmp/t/spec.md --curated /tmp/t/curated; then
            echo "::error::التدرّج لم يُكتشف"
            exit 1
          fi
          echo "التدرّج يُكتشف"

      - name: دورة المراجعة تختار الأقدم عهداً
        run: |
          set -euo pipefail
          mkdir -p /tmp/rv/curated
          cat > /tmp/rv/curated/a.json <<'JSON'
          {"_batch": "x", "alpha": {"ipa": "/a/"}, "beta": {"ipa": "/b/"},
           "gamma": {"ipa": "/g/"}, "delta": {"ipa": "/d/"}}
          JSON
          cat > /tmp/rv/state.json <<'JSON'
          {"reviewed": {"alpha": "2026-01-01", "beta": "2026-06-01"}}
          JSON
          got=$(python3 tools/enrich/review_pick.py --curated /tmp/rv/curated \
                  --state /tmp/rv/state.json --limit 3 | grep -v '^#' | tr '\n' ' ')
          echo "اختار: $got"
          # ما لم يُراجَع قطّ يسبق، ثم الأقدم تاريخاً
          [ "$got" = "delta gamma alpha " ] || { echo "::error::ترتيب خاطئ: $got"; exit 1; }
          python3 tools/enrich/review_pick.py --curated /tmp/rv/curated \
            --state /tmp/rv/state.json --commit delta gamma
          again=$(python3 tools/enrich/review_pick.py --curated /tmp/rv/curated \
                    --state /tmp/rv/state.json --limit 1 | grep -v '^#')
          [ "$again" = "alpha" ] || { echo "::error::التسجيل لم يُغيّر الدور: $again"; exit 1; }
          echo "الدورة صحيحة"

      - name: حارس النطاق يمنع مسّ ما لم يُؤذن به
        run: |
          set -euo pipefail
          mkdir -p /tmp/sg/before /tmp/sg/after
          cat > /tmp/sg/before/a.json <<'JSON'
          {"one": {"ipa": "/1/"}, "two": {"ipa": "/2/"}, "three": {"ipa": "/3/"}}
          JSON

          # تغييرٌ داخل الإذن — يمرّ
          cat > /tmp/sg/after/a.json <<'JSON'
          {"one": {"ipa": "/ONE/"}, "two": {"ipa": "/2/"}, "three": {"ipa": "/3/"}}
          JSON
          python3 tools/enrich/scope_guard.py --before /tmp/sg/before \
            --after /tmp/sg/after --allow one

          # تغييرٌ خارج الإذن — يُردّ
          if python3 tools/enrich/scope_guard.py --before /tmp/sg/before \
               --after /tmp/sg/after --allow two; then
            echo "::error::التغيير خارج الإذن لم يُكتشف"; exit 1
          fi

          # بطاقةٌ اختفت — تُردّ ولو كانت في الإذن
          cat > /tmp/sg/after/a.json <<'JSON'
          {"one": {"ipa": "/1/"}, "two": {"ipa": "/2/"}}
          JSON
          if python3 tools/enrich/scope_guard.py --before /tmp/sg/before \
               --after /tmp/sg/after --allow one two three; then
            echo "::error::الحذف لم يُكتشف"; exit 1
          fi
          echo "حارس النطاق يعمل"

      - name: الحدود الدنيا كما في المواصفة
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools/enrich")
          from audit_cards import MINIMUM
          # الظرف لا يُصرَّف — فحدُّ التصريف واحد، وإلا حُشيت الخانة بمشتقّ
          assert MINIMUM["inflections"] == 1, MINIMUM["inflections"]
          print("الحدود الدنيا: صحيحة")
          PY
